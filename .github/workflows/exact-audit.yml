name: Exact reproducibility audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reproducibility
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: reproducibility/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run exact audits
        run: python run_core_audit.py
